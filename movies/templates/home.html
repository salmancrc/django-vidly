{% extends 'base.html' %} {% block content %}
<div class="container py-5">
  <div class="row align-items-center justify-content-center py-5">
    <div class="col-lg-8 text-center">
      <div
        class="bg-primary rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4 animate-bounce"
        style="width: 120px; height: 120px"
      >
        <i
          class="bi bi-camera-reels-fill text-white"
          style="font-size: 3rem"
        ></i>
      </div>

      <h1 class="display-4 fw-bold text-dark mb-4 animate-fade-in">
        Welcome to <span class="text-primary">Vidly</span>
      </h1>

      <p class="lead text-muted mb-5 animate-fade-in-delay">
        Your premier destination for movie rentals.
      </p>

      <a
        href="{% url 'movies:index' %}"
        class="btn btn-primary btn-lg rounded-pill px-5 animate-pulse"
      >
        <i class="bi bi-collection-play me-2"></i>Browse Movies
      </a>
    </div>
  </div>
</div>
{% endblock %}
